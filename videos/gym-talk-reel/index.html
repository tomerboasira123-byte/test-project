<!doctype html>
<html lang="he">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      @font-face {
        font-family: "Rubik Hebrew";
        src: url("assets/fonts/rubik-hebrew-var.woff2") format("woff2");
        font-weight: 400 900;
        font-style: normal;
        font-display: block;
      }
      body {
        font-family: "Rubik Hebrew", sans-serif;
        direction: rtl;
      }

      .clip {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      #source-video {
        object-fit: cover;
        transform-origin: center center;
      }

      /* Bottom contrast band so white captions stay legible over the gym background */
      #caption-scrim {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 46%;
        background: linear-gradient(to bottom, rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, 0.62) 62%, rgba(0, 0, 0, 0.62) 100%);
        pointer-events: none;
      }

      /* Caption layer */
      #caption-layer {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 300px;
        display: flex;
        justify-content: center;
        padding: 0 56px;
        pointer-events: none;
      }
      .cap-line {
        position: absolute;
        left: 56px;
        right: 56px;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-content: center;
        row-gap: 14px;
        column-gap: 24px;
        visibility: hidden;
      }
      .cap-line .cap-word {
        position: relative;
        display: inline-block;
        opacity: 0;
        font-family: "Rubik Hebrew", sans-serif;
        font-weight: 800;
        font-size: 60px;
        line-height: 1.28;
        letter-spacing: 0.004em;
        color: #ffffff;
        text-shadow:
          0 2px 0 rgba(0, 0, 0, 0.85),
          0 4px 14px rgba(0, 0, 0, 0.55);
        unicode-bidi: plaintext;
      }
      .cap-line .cap-word.emph {
        color: #ffd23f;
      }
      .cap-word .accent-bar {
        position: absolute;
        left: 0;
        right: 0;
        bottom: -8px;
        height: 7px;
        border-radius: 4px;
        background: #ffd23f;
        box-shadow: 0 0 16px rgba(255, 210, 63, 0.75);
        transform: scaleX(0);
        transform-origin: right center;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="40.85"
      data-width="1080"
      data-height="1920"
    >
      <video
        id="source-video"
        class="clip"
        src="assets/source.mp4"
        data-start="0"
        data-duration="40.85"
        data-media-start="11.6"
        data-track-index="0"
        muted
        playsinline
      ></video>

      <audio
        id="source-audio"
        src="assets/source.mp4"
        data-start="0"
        data-duration="40.85"
        data-media-start="11.6"
        data-track-index="10"
      ></audio>

      <audio
        id="bgm"
        src="assets/bgm.m4a"
        data-start="0"
        data-duration="40.85"
        data-track-index="11"
        data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":0},{"t":1.2,"v":0.16},{"t":39.5,"v":0.16},{"t":40.85,"v":0}]}]}'
      ></audio>

      <div id="caption-scrim"></div>

      <div id="caption-layer">
        <!-- caption groups injected by script below -->
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // --- Caption groups (word/phrase-synced) ---
      // Hebrew transcript from Deepgram (nova-3, word-level timestamps), grouped
      // into short phrases on natural speech pauses / sentence breaks.
      var CAPTION_GROUPS = [
        { start: 0, end: 1.36, words: [{ text: "בואו" }, { text: "נדבר," }, { text: "רגע," }] },
        { start: 1.36, end: 3.12, words: [{ text: "עוד" }, { text: "יום" }, { text: "אחד" }, { text: "עוד" }, { text: "פעם" }] },
        { start: 3.12, end: 4.32, words: [{ text: "אני" }, { text: "הולך" }, { text: "להתאמן," }] },
        { start: 4.4, end: 5.44, words: [{ text: "ואני" }, { text: "לא" }, { text: "פרסומת." }] },
        { start: 5.44, end: 6.48, words: [{ text: "אני" }, { text: "לא" }, { text: "בא" }, { text: "להגיד" }, { text: "לכם" }, { text: "את" }, { text: "זה" }] },
        { start: 6.48, end: 7.68, words: [{ text: "בשביל" }, { text: "לעשות" }, { text: "פרסומת." }] },
        { start: 7.68, end: 9.28, words: [{ text: "אבל" }, { text: "כמה" }, { text: "פעמים" }, { text: "תגידו" }, { text: "לעצמך:" }] },
        { start: 9.28, end: 10.96, words: [{ text: "“עם" }, { text: "עוד" }, { text: "יום" }, { text: "אחד" }, { text: "ועוד" }, { text: "פעם" }] },
        { start: 10.96, end: 11.68, words: [{ text: "תסבלו" }, { text: "את" }, { text: "זה”," }] },
        { start: 11.68, end: 13.92, words: [{ text: "ועוד" }, { text: "פעם" }, { text: "יהיה" }, { text: "חוסר" }, { text: "ביטחון." }] },
        { start: 14.335, end: 15.775, words: [{ text: "וכל" }, { text: "הדברים" }, { text: "האלה" }] },
        { start: 15.775, end: 17.535, words: [{ text: "זה" }, { text: "נטו" }, { text: "בשביל" }, { text: "להסביר" }, { text: "לכם" }] },
        { start: 17.535, end: 19.695, words: [{ text: "שאפשרי" }, { text: "כבר" }, { text: "לא" }, { text: "להיות" }, { text: "ככה." }] },
        { start: 19.695, end: 21.055, words: [{ text: "באמת" }, { text: "כל" }, { text: "כך", emph: true }, { text: "פשוט", emph: true }] },
        { start: 21.055, end: 23.695, words: [{ text: "לבוא" }, { text: "ולעשות" }, { text: "שלוש" }, { text: "וחצי" }, { text: "שנה" }, { text: "תהליך" }] },
        { start: 23.695, end: 26.975, words: [{ text: "עם" }, { text: "עצמכם," }, { text: "להבין" }, { text: "שאתם" }, { text: "הולכים" }] },
        { start: 27.22, end: 29.46, words: [{ text: "למקום" }, { text: "אחר," }, { text: "לתהליך" }, { text: "שהולך" }] },
        { start: 29.46, end: 30.34, words: [{ text: "לשנות" }, { text: "אתכם" }, { text: "את" }, { text: "החיים.", emph: true }] },
        { start: 30.34, end: 31.86, words: [{ text: "חבר’ה," }, { text: "מתי" }, { text: "שתבינו" }, { text: "את" }, { text: "זה" }] },
        { start: 31.86, end: 33.94, words: [{ text: "שזה" }, { text: "כל" }, { text: "כך", emph: true }, { text: "פשוט", emph: true }, { text: "ולא" }, { text: "מורכב," }] },
        { start: 33.94, end: 35.3, words: [{ text: "כמו" }, { text: "שאמרנו" }, { text: "תמיד." }] },
        { start: 35.7, end: 36.98, words: [{ text: "הדברים" }, { text: "השתנו.", emph: true }] },
        { start: 37.06, end: 38.66, words: [{ text: "חבר’ה," }, { text: "שלחו" }, { text: "לי" }, { text: "פה" }, { text: "הודעה", emph: true }] },
        { start: 38.66, end: 39.78, words: [{ text: "ובואו" }, { text: "נדבר" }, { text: "—" }, { text: "אני" }, { text: "באמת" }] },
        { start: 39.78, end: 40.74, words: [{ text: "יכול" }, { text: "לעזור" }, { text: "לכם." }] },
      ];

      // Video motion: a slow continuous push-in (Ken Burns) with a quick punch-in
      // "beat" layered on at each emphasized caption line, so the shot itself
      // gets more energetic right where the words do. Built as ONE continuous
      // authored path on #source-video's scale (never two competing tweens on
      // the same property at once — hyperframes-core/determinism-rules.md).
      var DURATION = 40.85;
      var BASE_FROM = 1.0;
      var BASE_TO = 1.07;
      function baseScale(t) {
        return BASE_FROM + (BASE_TO - BASE_FROM) * (t / DURATION);
      }
      var EMPH_TIMES = CAPTION_GROUPS.filter(function (g) {
        return g.words.some(function (w) {
          return w.emph;
        });
      }).map(function (g) {
        return g.start;
      });

      tl.set("#source-video", { scale: baseScale(0) }, 0);
      var cursor = 0;
      EMPH_TIMES.forEach(function (te) {
        if (te <= cursor + 0.5) return;
        tl.to("#source-video", { scale: baseScale(te), duration: te - cursor, ease: "none" }, cursor);
        var bumpScale = baseScale(te) + 0.03;
        tl.to("#source-video", { scale: bumpScale, duration: 0.16, ease: "power2.out" }, te);
        var settleEnd = te + 0.5;
        tl.to(
          "#source-video",
          { scale: baseScale(settleEnd), duration: 0.34, ease: "power2.inOut" },
          te + 0.16,
        );
        cursor = settleEnd;
      });
      tl.to("#source-video", { scale: baseScale(DURATION), duration: DURATION - cursor, ease: "none" }, cursor);

      // Per-word "waterfall" arrival: each word whips in from below, overlapping
      // the previous one (hyperframes-animation/rules/waterfall-entry.md) so the
      // group reads as one energetic beat instead of a flat block fade.
      var F = 1 / 60;
      var layer = document.getElementById("caption-layer");

      CAPTION_GROUPS.forEach(function (group, gi) {
        var el = document.createElement("div");
        el.className = "cap-line";
        el.id = "cg-" + gi;
        layer.appendChild(el);

        var nextStart = group.start;
        group.words.forEach(function (w, wi) {
          var span = document.createElement("span");
          span.className = "cap-word" + (w.emph ? " emph" : "");
          span.id = "cg-" + gi + "-w" + wi;
          span.textContent = w.text;
          el.appendChild(span);

          var hebLetters = (w.text.match(/[֐-׿]/g) || []).length;
          var weight = w.emph ? "heavy" : hebLetters <= 2 ? "light" : "normal";
          var yOff = weight === "heavy" ? 70 : weight === "light" ? 34 : 46;
          var dur = weight === "heavy" ? 0.19 : weight === "light" ? 0.12 : 0.15;
          var overlapF = weight === "light" ? 2 : 1;

          var start = nextStart;
          tl.set(span, { opacity: 1, y: yOff }, start);
          tl.to(span, { y: 0, duration: dur, ease: "power4.out" }, start);
          nextStart = start + dur - overlapF * F;

          if (w.emph) {
            var bar = document.createElement("span");
            bar.className = "accent-bar";
            span.appendChild(bar);
            tl.to(bar, { scaleX: 1, duration: 0.16, ease: "power2.out" }, start + dur * 0.6);
          }
        });

        tl.set(el, { visibility: "visible" }, group.start);
        tl.to(el, { opacity: 0, duration: 0.12, ease: "power2.in" }, group.end - 0.12);
        tl.set(el, { visibility: "hidden" }, group.end);
      });

      // Self-lint: every caption group must be fully hidden right after its end.
      CAPTION_GROUPS.forEach(function (group, gi) {
        var el = document.getElementById("cg-" + gi);
        if (!el) return;
        tl.seek(group.end + 0.01);
        var computed = window.getComputedStyle(el);
        if (computed.opacity !== "0" && computed.visibility !== "hidden") {
          console.warn(
            "[caption-lint] group " + gi + " still visible at t=" + (group.end + 0.01).toFixed(2) + "s",
          );
        }
      });
      tl.seek(0);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
